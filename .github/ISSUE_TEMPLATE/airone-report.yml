name: 환기청정(에어원) 제보
description: 에어원이 됐는지 안 됐는지 알려 주세요. 어느 쪽이든 도움이 됩니다.
labels: ["환기청정", "제보"]
body:
  - type: markdown
    attributes:
      value: |
        **에어원 지원을 넣었지만 실기기로 검증하지 못했습니다.** 집에 에어원이
        없습니다. 규약은 앱에서 그대로 뽑았지만, 한 번도 보내본 적이 없습니다.

        그래서 **되든 안 되든 알려 주시는 것이 그대로 도움이 됩니다.**

        아래 통계정보 파일 하나만 붙여 주시면 됩니다. 기기ID·IP·MAC·별칭은
        **자동으로 가려집니다.**

  - type: dropdown
    id: result
    attributes:
      label: 결과
      description: 가장 가까운 것을 골라 주세요.
      options:
        - 잘 됩니다
        - 상태는 보이는데 제어가 안 됩니다
        - 엔티티가 생겼는데 값이 계속 비어 있습니다
        - 엔티티가 아예 안 생깁니다
        - 값이 실제와 다르게 보입니다
        - 그 밖
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 모델명
      description: 기기 본체나 앱 기기목록에 적힌 이름입니다.
      placeholder: 예) NRT530-ZCW, TAC550-20S
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 통계정보 파일
      description: |
        설정 → 기기 및 서비스 → **나비엔 스마트** → ⋮ → `통계정보 다운로드`

        내려받은 `.json` 파일을 이 칸에 끌어다 놓거나 내용을 붙여 주세요.
        필요한 것이 전부 그 안에 있습니다. 따로 찾아보실 것은 없습니다.

        **값이 비어 있는 증상이라면** HA 에서 모드나 전원을 한 번 바꿔 본 뒤에
        받아 주세요. 기기가 응답을 보냈는지, 보냈는데 저희가 못 읽었는지가
        파일에 기록됩니다 — 그 둘을 가리는 것이 원인 찾기의 전부입니다.
      render: json
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 무엇이 어떻게 달랐나요
      description: |
        앱에서 보이는 것과 HA 에서 보이는 것이 다르면 그 차이를 적어 주세요.
        가장 빠르게 고칠 수 있는 단서입니다.
      placeholder: |
        예)
        - 앱은 「자동 | 자동」인데 HA 는 「환기」로 보입니다
        - 풍량을 강풍으로 바꾸면 앱에서는 약풍이 됩니다
        - 목표 습도 슬라이더를 움직여도 아무 일도 안 일어납니다
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: 확인 협조
      options:
        - label: >-
            원인을 좁히려면 명령을 하나씩 보내 확인해야 할 수 있습니다.
            요청하면 도와주실 수 있습니다.
          required: false
