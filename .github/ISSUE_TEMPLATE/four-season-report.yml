name: 사계절 매트 냉방 제보
description: 냉방 제어가 실제로 먹히는지 확인하려면 이 정보가 필요합니다.
labels: ["사계절", "제보"]
body:
  - type: markdown
    attributes:
      value: |
        **냉방이 됩니다.** `EMF520` 에서 실기기로 확인했습니다 — 난방↔냉방 전환,
        냉방 온도 조절(20~35, 0.5℃), 그리고 **좌우를 따로 잡는 것**까지.

        확인된 것은 **온도로 표시되는 모델 한 대**뿐입니다. 남은 것 둘입니다.

        - **단계(1~8)로 표시되는 사계절 모델** — 냉방 값 범위를 몰라 막아 두었습니다
        - `EMF520` 외의 모델 — 될 것으로 보지만 확인하지 못했습니다

        둘 중 하나에 해당하시면 이 제보가 그대로 그 모델을 여는 근거가 됩니다.

        통계정보 파일 하나면 대부분 확인됩니다. 따로 찾아보실 것은 없습니다.

  - type: input
    id: model
    attributes:
      label: 모델명
      placeholder: 예) EMF501, EMF520, EMW753, EMW750
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 냉방에서 HA 로 온도를 바꿔 보셨나요
      options:
        - 바꿨고, 기기가 그대로 따라왔습니다
        - 바꿨는데 기기가 안 따라옵니다
        - 바꿨는데 잠깐 바뀌었다가 원래 값으로 되돌아갑니다
        - HA 에서 온도를 바꿀 수 없습니다 (슬라이더가 없거나 비활성)
        - 아직 안 해봤습니다
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 통계정보 파일 — 냉방에서 온도를 바꿔 본 뒤에 받아 주세요
      description: |
        **냉방으로 켜고, HA 에서 온도를 한 번 바꾼 다음** 받아 주세요.
        보낸 값과 기기가 돌려준 값이 파일에 함께 기록되어, 먹혔는지 아닌지
        저희가 눈으로 확인할 수 있습니다.

        설정 → 기기 및 서비스 → **나비엔 스마트** → ⋮ → `통계정보 다운로드`

        기기ID · IP · MAC · SSID · 아이디 · 별칭은 자동으로 가려집니다.
      render: json
    validations:
      required: true

  - type: input
    id: app_range
    attributes:
      label: 앱에서 냉방 온도를 조절할 때 보이는 범위
      description: 앱 화면에 표시되는 최저~최고 값을 그대로 적어 주세요.
      placeholder: 예) 25.0° ~ 35.0°, 또는 1~8단계
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: 냉방 온도를 한 칸 올리면 얼마씩 바뀌나요
      options:
        - "0.5씩 (예: 25.0 → 25.5)"
        - "1씩 (예: 25 → 26)"
        - 단계로 표시됨 (숫자에 도 표시가 없음)
        - 잘 모르겠습니다
    validations:
      required: true

  - type: dropdown
    id: mirror
    attributes:
      label: 좌우 분리 모델이라면 — 냉방에서 한쪽 온도만 바꿀 수 있나요
      description: |
        **`EMF520` 은 따로 됩니다** — 제보자가 냉방에서 좌 25.0 · 우 25.5 로
        확인해 주셨습니다. 다만 나비엔은 「0.5℃ 분리 냉난방」이 사계절형 Pro 에만
        적용된다고 안내하므로 **모델마다 다를 수 있습니다.**

        저희는 누르신 쪽에만 보내고 기기가 돌려주는 값을 그대로 보여줍니다 —
        어느 쪽인지 알려주시면 문서에 반영합니다.
      options:
        - 각각 따로 됩니다
        - 한쪽을 바꾸면 반대쪽도 같이 바뀝니다
        - 좌우 분리 모델이 아닙니다
        - 잘 모르겠습니다
    validations:
      required: false

  - type: textarea
    id: cool_ui
    attributes:
      label: 냉방 화면에 따로 보이는 것
      description: |
        냉방에는 팬 속도와 결로방지 설정이 붙는 것으로 보입니다. 앱에서 보이는지 알려주세요.
      placeholder: |
        예)
        - 팬 세기 조절 있음 / 없음
        - 결로방지 켜고 끄기 있음 / 없음
        - 난방과 냉방을 전환하는 버튼 위치
    validations:
      required: false
