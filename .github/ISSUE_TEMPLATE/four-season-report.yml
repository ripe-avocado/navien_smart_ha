name: 사계절 매트 냉방 제보
description: 냉방 제어가 실제로 먹히는지 확인하려면 이 정보가 필요합니다.
labels: ["사계절", "제보"]
body:
  - type: markdown
    attributes:
      value: |
        **`v0.9.0` 부터 냉방 온도 조절이 됩니다.** 다만 실기기로 확인한 것은
        온도로 표시되는 모델뿐입니다. 단계(1~8)로 표시되는 모델의 냉방은
        아직 막아 두었습니다.

        **난방↔냉방 전환은 아직 안 됩니다.** 기기나 앱에서 바꿔 주세요.

        통계정보 파일 하나면 대부분 확인됩니다. 따로 찾아보실 것은 없습니다.

  - type: input
    id: model
    attributes:
      label: 모델명
      placeholder: 예) EMF501, EMF520, EMW753, EMW750
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 냉방에서 HA 로 온도를 바꿔 보셨나요
      options:
        - 바꿨고, 기기가 그대로 따라왔습니다
        - 바꿨는데 기기가 안 따라옵니다
        - 바꿨는데 잠깐 바뀌었다가 원래 값으로 되돌아갑니다
        - HA 에서 온도를 바꿀 수 없습니다 (슬라이더가 없거나 비활성)
        - 아직 안 해봤습니다
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 통계정보 파일 — 냉방에서 온도를 바꿔 본 뒤에 받아 주세요
      description: |
        **냉방으로 켜고, HA 에서 온도를 한 번 바꾼 다음** 받아 주세요.
        보낸 값과 기기가 돌려준 값이 파일에 함께 기록되어, 먹혔는지 아닌지
        저희가 눈으로 확인할 수 있습니다.

        설정 → 기기 및 서비스 → **나비엔 스마트** → ⋮ → `통계정보 다운로드`

        기기ID · IP · MAC · SSID · 아이디 · 별칭은 자동으로 가려집니다.
      render: json
    validations:
      required: true

  - type: input
    id: app_range
    attributes:
      label: 앱에서 냉방 온도를 조절할 때 보이는 범위
      description: 앱 화면에 표시되는 최저~최고 값을 그대로 적어 주세요.
      placeholder: 예) 25.0° ~ 35.0°, 또는 1~8단계
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: 냉방 온도를 한 칸 올리면 얼마씩 바뀌나요
      options:
        - "0.5씩 (예: 25.0 → 25.5)"
        - "1씩 (예: 25 → 26)"
        - 단계로 표시됨 (숫자에 도 표시가 없음)
        - 잘 모르겠습니다
    validations:
      required: true

  - type: dropdown
    id: mirror
    attributes:
      label: 좌우 분리 모델이라면 — 한쪽 온도를 바꾸면 반대쪽도 같이 바뀌나요
      description: |
        냉방에서는 좌우가 같은 온도가 되는 것이 정상 동작으로 보입니다.
        실제로 그런지 확인하고 싶습니다.
      options:
        - 같이 바뀝니다
        - 각각 따로 바뀝니다
        - 좌우 분리 모델이 아닙니다
        - 잘 모르겠습니다
    validations:
      required: false

  - type: textarea
    id: cool_ui
    attributes:
      label: 냉방 화면에 따로 보이는 것
      description: |
        냉방에는 팬 속도와 결로방지 설정이 붙는 것으로 보입니다. 앱에서 보이는지 알려주세요.
      placeholder: |
        예)
        - 팬 세기 조절 있음 / 없음
        - 결로방지 켜고 끄기 있음 / 없음
        - 난방과 냉방을 전환하는 버튼 위치
    validations:
      required: false
