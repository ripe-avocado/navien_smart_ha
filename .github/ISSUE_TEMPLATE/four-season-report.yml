name: 사계절 매트 냉방 제보
description: 사계절 매트의 냉방을 열려면 이 정보가 필요합니다.
labels: ["사계절", "제보"]
body:
  - type: markdown
    attributes:
      value: |
        사계절 매트는 **난방은 지금도 됩니다.** 냉방으로 두면 제어가 일시적으로
        비활성됩니다 — 냉방 쪽 값 체계를 실기기로 확인하지 못했기 때문입니다.

        아래 정보가 오면 냉방을 열 수 있습니다. 진단 파일 하나로 대부분 해결됩니다.

  - type: input
    id: model
    attributes:
      label: 모델명
      placeholder: 예) EMF501, EMF520, EMW753, EMW750
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보 — 냉방으로 켜둔 상태에서 받아 주세요
      description: |
        **매트를 냉방으로 켜둔 뒤에** 받아 주세요. 난방 상태에서 받으면 냉방 관련
        값이 비어 있어서 쓸모가 없습니다.

        설정 → 기기 및 서비스 → **나비엔 스마트** → ⋮ → `통계정보 다운로드`

        HA 버전에 따라 `진단 정보 다운로드` 로 보일 수도 있습니다 (원문 Download diagnostics). ⋮ 메뉴의 내려받기 항목입니다.

        파일 안에 필요한 값이 다 들어 있습니다. 따로 찾아보실 것은 없습니다.
      render: json
    validations:
      required: true

  - type: input
    id: app_range
    attributes:
      label: 앱에서 냉방 온도를 조절할 때 보이는 범위
      description: 앱 화면에 표시되는 최저~최고 값을 그대로 적어 주세요.
      placeholder: 예) 25.0° ~ 35.0°, 또는 1~8단계
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: 냉방 온도를 한 칸 올리면 얼마씩 바뀌나요
      options:
        - "0.5씩 (예: 25.0 → 25.5)"
        - "1씩 (예: 25 → 26)"
        - 단계로 표시됨 (숫자에 도 표시가 없음)
        - 잘 모르겠습니다
    validations:
      required: true

  - type: textarea
    id: cool_ui
    attributes:
      label: 냉방 화면에 따로 보이는 것
      description: |
        냉방에는 팬 속도와 결로방지 설정이 붙는 것으로 보입니다. 앱에서 보이는지 알려주세요.
      placeholder: |
        예)
        - 팬 세기 조절 있음 / 없음
        - 결로방지 켜고 끄기 있음 / 없음
        - 난방과 냉방을 전환하는 버튼 위치
    validations:
      required: false
